<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660">
  <rect width="1120" height="660" fill="white"/>
  <g font-family="sans-serif">
    <text x="24" y="39" font-size="27" fill="#0f172a">A shorter route can lose a branch connection</text>
    <text x="24" y="73" font-size="17" fill="#334155">Physical connectivity checks the round copper outline, including the trace's 0.80 mm width.</text>
    <g transform="translate(24 100)"><rect width="520" height="480" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="34" font-size="21" fill="#0f172a">Before: bent route touches the pad</text>
    <text x="24" y="61" font-size="15" fill="#334155">All three terminals share one copper component.</text>
    <rect x="140" y="245" width="120" height="120" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
        <circle cx="200" cy="305" r="60" fill="#2563eb" fill-opacity="0.2" stroke="#2563eb" stroke-width="2"/>
    <line x1="140" y1="125" x2="236" y2="269" stroke="#2563eb" stroke-width="48" stroke-linecap="round"/>
<line x1="236" y1="269" x2="380" y2="365" stroke="#2563eb" stroke-width="48" stroke-linecap="round"/>
    <circle cx="140" cy="125" r="4" fill="white" stroke="#2563eb" stroke-width="2"/>
      <text x="117" y="105" font-size="17" fill="#2563eb">A</text>
<circle cx="380" cy="365" r="4" fill="white" stroke="#2563eb" stroke-width="2"/>
      <text x="414" y="390" font-size="17" fill="#2563eb">B</text>
<circle cx="200" cy="305" r="4" fill="white" stroke="#2563eb" stroke-width="2"/>
      <text x="147" y="388" font-size="17" fill="#2563eb">branch</text>
    <text x="24" y="423" font-size="17" fill="#2563eb">Component 1: A + B + branch</text></g>
    <g transform="translate(576 100)"><rect width="520" height="480" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="24" y="34" font-size="21" fill="#0f172a">After: shortcut misses the pad</text>
    <text x="24" y="61" font-size="15" fill="#334155">A and B stay connected; the branch is isolated.</text>
    <rect x="140" y="245" width="120" height="120" fill="none" stroke="#94a3b8" stroke-dasharray="6 5"/>
        <circle cx="200" cy="305" r="60" fill="#c2410c" fill-opacity="0.2" stroke="#c2410c" stroke-width="2"/>
    <line x1="140" y1="125" x2="380" y2="365" stroke="#2563eb" stroke-width="48" stroke-linecap="round"/>
    <circle cx="140" cy="125" r="4" fill="white" stroke="#2563eb" stroke-width="2"/>
      <text x="117" y="105" font-size="17" fill="#2563eb">A</text>
<circle cx="380" cy="365" r="4" fill="white" stroke="#2563eb" stroke-width="2"/>
      <text x="414" y="390" font-size="17" fill="#2563eb">B</text>
<circle cx="200" cy="305" r="4" fill="white" stroke="#c2410c" stroke-width="2"/>
      <text x="147" y="388" font-size="17" fill="#c2410c">branch</text>
    <text x="24" y="423" font-size="17" fill="#2563eb">Component 1: A + B</text>
<text x="24" y="450" font-size="17" fill="#c2410c">Component 2: branch</text></g>
    <text x="24" y="614" font-size="16" fill="#334155">Dashed square: pad bounds used for search. Filled circle: the actual conductive pad.</text>
    <text x="24" y="641" font-size="15" fill="#334155">Colors show captured physical components. Every terminal has the same intended net name (NET).</text>
  </g>
</svg>